<!-- Script Pembaca JSON Dinamis di detail.html -->
  <script>
    function changeImage(src) {
      document.getElementById('currentImg').src = src;
    }

    // Membaca ID produk dari URL (contoh: detail.html?id=meja-makan-jati-6-kursi)
    const urlParams = new URLSearchParams(window.location.search);
    const productId = urlParams.get('id');

    fetch('products.json')
      .then(res => res.json())
      .then(data => {
        if (!data || data.length === 0) return;
        
        // Cari produk berdasarkan ID, jika tidak ada tampilkan produk pertama
        const p = data.find(item => item.id === productId) || data[0];

        // Update Judul & Gambar
        document.title = `${p.title} - JatiCraft Jepara`;
        document.querySelector('.product-info h1').innerText = p.title;
        document.querySelector('.price-tag').innerText = p.price;
        document.getElementById('currentImg').src = p.image;

        // Update Tombol WhatsApp
        const waText = encodeURIComponent(`Halo JatiCraft, saya ingin memesan ${p.title} (${p.price})`);
        document.querySelector('.btn-order').href = `https://wa.me/6281234567890?text=${waText}`;

        // Update Galeri Foto Thumbnail
        const thumbGrid = document.querySelector('.thumb-grid');
        if (p.thumbs && p.thumbs.length > 0) {
          thumbGrid.innerHTML = '';
          p.thumbs.forEach(tUrl => {
            const img = document.createElement('img');
            img.src = tUrl;
            img.className = 'thumb';
            img.width = 80;
            img.height = 60;
            img.onclick = () => changeImage(tUrl);
            thumbGrid.appendChild(img);
          });
        }

        // Update Tabel Spesifikasi Teknis
        const specsTable = document.querySelector('.specs-table');
        if (p.specs) {
          specsTable.innerHTML = '';
          for (const [key, val] of Object.entries(p.specs)) {
            specsTable.innerHTML += `<tr><td>${key}</td><td>${val}</td></tr>`;
          }
        }

        // Update Deskripsi Produk
        if (p.description) {
          document.querySelector('.post-content p').innerText = p.description;
        }
      })
      .catch(err => console.log('Gagal memuat detail produk JSON:', err));
  </script>
